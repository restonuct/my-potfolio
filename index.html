<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Amal Mohammed M — B.Tech Computer Science Portfolio</title>
  <link rel="icon" href="/profile.jpg" type="image/jpeg">
  <meta name="description"
    content="Personal portfolio of Amal Mohammed M — First-Year B.Tech Computer Science Student. Creator of B.A.D.I. and Ganesan Run." />
  <!-- Apple Web App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" id="theme-color-meta" />
  
  <!-- Prevent FOUC: default to dark, respect light if saved -->
  <script>
    (function () {
      try {
        var override = new URLSearchParams(window.location.search).get('theme');
        var saved = localStorage.getItem('apple-portfolio-theme');
        if (override === 'light' || (!override && saved === 'light')) {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Inter Font fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body
  class="font-sf antialiased bg-apple-bg-light dark:bg-apple-bg-dark text-neutral-900 dark:text-neutral-100 transition-colors duration-500 selection:bg-apple-blue selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
